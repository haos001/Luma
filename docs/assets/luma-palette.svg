<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="224" viewBox="0 0 1280 224" role="img" aria-labelledby="title desc">
  <title id="title">Six of Luma's forty color presets</title>
  <desc id="desc">Warm Focus FFCA9C, Eucalyptus 8EC9B3, Pink Dawn D99BB6, Autumn Leaf C98758, Night Poetry B47E96, and Orchid CB8FC9.</desc>
  <rect width="1280" height="224" rx="24" fill="#16151c"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g transform="translate(120 0)">
      <rect x="-80" y="32" width="160" height="100" rx="18" fill="#FFCA9C"/>
      <text y="163" fill="#f1edf4" font-size="17" font-weight="600">Warm Focus</text>
      <text y="190" fill="#aaa2b4" font-size="13" letter-spacing="1">#FFCA9C</text>
    </g>
    <g transform="translate(328 0)">
      <rect x="-80" y="32" width="160" height="100" rx="18" fill="#8EC9B3"/>
      <text y="163" fill="#f1edf4" font-size="17" font-weight="600">Eucalyptus</text>
      <text y="190" fill="#aaa2b4" font-size="13" letter-spacing="1">#8EC9B3</text>
    </g>
    <g transform="translate(536 0)">
      <rect x="-80" y="32" width="160" height="100" rx="18" fill="#D99BB6"/>
      <text y="163" fill="#f1edf4" font-size="17" font-weight="600">Pink Dawn</text>
      <text y="190" fill="#aaa2b4" font-size="13" letter-spacing="1">#D99BB6</text>
    </g>
    <g transform="translate(744 0)">
      <rect x="-80" y="32" width="160" height="100" rx="18" fill="#C98758"/>
      <text y="163" fill="#f1edf4" font-size="17" font-weight="600">Autumn Leaf</text>
      <text y="190" fill="#aaa2b4" font-size="13" letter-spacing="1">#C98758</text>
    </g>
    <g transform="translate(952 0)">
      <rect x="-80" y="32" width="160" height="100" rx="18" fill="#B47E96"/>
      <text y="163" fill="#f1edf4" font-size="17" font-weight="600">Night Poetry</text>
      <text y="190" fill="#aaa2b4" font-size="13" letter-spacing="1">#B47E96</text>
    </g>
    <g transform="translate(1160 0)">
      <rect x="-80" y="32" width="160" height="100" rx="18" fill="#CB8FC9"/>
      <text y="163" fill="#f1edf4" font-size="17" font-weight="600">Orchid</text>
      <text y="190" fill="#aaa2b4" font-size="13" letter-spacing="1">#CB8FC9</text>
    </g>
