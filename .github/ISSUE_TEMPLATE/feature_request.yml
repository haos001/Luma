name: Feature request
description: Suggest a focused improvement
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Consider whether it still works when the app is closed and whether it needs new permissions or dependencies
    validations:
      required: true
